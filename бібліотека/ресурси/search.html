<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="xdocs-url-prefix" content="{{PAGE_URL_PREFIX}}">
</head>
<body>

<script>
  const searchData = JSON.parse("[{\"title\":\"Бібліотека КДБ\",\"content\":\"# Бібліотека КДБ\\n\\nМедіа та література, які мені подобаються.\\n\",\"path\":\"index.html\"},{\"title\":\"Книги | Бібліотека КДБ\",\"content\":\"# Книги\\n\\n- **Lingua Latina: Familia Romana** від _Hans H. Ørberg_\\n\\n---\\n\\n> Тут я поки не вказую українських авторів, так як велику кількість їх проходять в школі. Їх всіх треба прочитати. І не лише те, що дають в школі.\\n\",\"path\":\"книги.html\"},{\"title\":\"Фільми | Бібліотека КДБ\",\"content\":\"# Фільми\\n\",\"path\":\"фільми.html\"},{\"title\":\"Відео | Бібліотека КДБ\",\"content\":\"# Відео\\n\",\"path\":\"відео.html\"},{\"title\":\"Аудіо | Бібліотека КДБ\",\"content\":\"# Аудіо\\n\",\"path\":\"аудіо.html\"}]");

  window.addEventListener("message", (event) => {
    const eventData = event.data;
    const eventId = eventData.id;
    const eventType = eventData.type;
    if (eventType === "search") {
      const query = eventData.query;
      const results = searchData.filter((item) => {
        return item.title.toLowerCase().includes(query.toLowerCase());
      });
      window.parent.postMessage(
        {
          id: eventId,
          result: results
        },
        "*"
      );
    }
  });
</script>
</body>
</html>
