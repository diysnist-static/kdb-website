<script>
  const searchData = JSON.parse("[{\"title\":\"Документи КДБ\",\"content\":\"# Документи КДБ\\n\\nТут в основному мої експерименти, дослідження та особисті речі.\\n\",\"path\":\"index.html\"},{\"title\":\"Я спалахну | Документи КДБ\",\"content\":\"# Я спалахну\\n\\nКолись я думав - ти усе. Тепер я знаю, що ніщо. <br>\\nЯ спалахну вже зовсім скоро. Я стану темною ніщо. <br>\\nЙ шляхи утворяться до мене. І стану я усім. <br>\\nБо все ніщо є, й ніщо є всім.\\n\",\"path\":\"я-спалахну.html\"},{\"title\":\"Сад Мудрості | Документи КДБ\",\"content\":\"# Сад Мудрості\\n\\nРосте Дерево, а на Дереві Плід - Новий Світ.<br>\\nКвітне, іде Весна.<br>\\nЗатрусилась мокра Земля - вкорінилося Дерево до кінця.<br>\\nУпав Плід, а у ньому Свідомість-Зерня; прийняла Земля.<br>\\nТече Річка Життя.<br>\\nПрийшла Пора, омилась Земля.<br>\\nРосте нове Дерево, а воно із Знання.\\n\",\"path\":\"сад-мудрості.html\"},{\"title\":\"ІД | Документи КДБ\",\"content\":\"# Ідея Д\\n\\nДіяч Здійснює.\\n\",\"path\":\"ІД.html\"},{\"title\":\"ІБ | Документи КДБ\",\"content\":\"# Ідея Б\\n\\nСлово через Діло стає Тілом.\\n\",\"path\":\"ІБ.html\"},{\"title\":\"ІМ | Документи КДБ\",\"content\":\"# Ідея М\\n\\nМета мета Предмета.\\n\",\"path\":\"ІМ.html\"},{\"title\":\"ІЦ | Документи КДБ\",\"content\":\"# Ідея Ц\\n\\nСубʼєкт це Обʼєкт.\\n\",\"path\":\"ІЦ.html\"},{\"title\":\"ІП | Документи КДБ\",\"content\":\"# Ідея П\\n\\nпризначення = значення\\n\",\"path\":\"ІП.html\"},{\"title\":\"ІЯ | Документи КДБ\",\"content\":\"# Ідея Я\\n\\nЯ сам себе створив.\\n\",\"path\":\"ІЯ.html\"},{\"title\":\"Київський порядок | Документи КДБ\",\"content\":\"# Київський порядок\\n\\nСерце! Серце! Ану стій! Ти куда мою кров діваєш!!! Прокричав мозок. <br>\\nНе твого ума діло; та й ти сам нею розкидуєш наліво направо - пробурмотіло серце. <br>\\nМозку сильно несподобалась така неповага до себе, але що ж він може зробити. Це ж правда, мозок і сам кров кудась розпилює\\nпостійно. <br>\\nМозок промовчав. <br>\\nІ тут органи почали скаржитись: <br>\\nАх ви, ах ви, зрадники, кров нашу куди діваєте, ми ж помремо?!?! <br>\\nА ви сидіть там тихо, і не рипайтесь, бо взагалі нічого не отримаєте; ви ж кров теж виводите кудась, не вам судити -\\nнаказали серце й мозок. <br>\\nІ правда: частина крові, що має йти на роботу шлунка, постійно кудись дівається. І штука в тому, що шлунок її\\nотримує. <br>\\nВиявляється, шлунок її зливає, щоб менше працювати. <br>\\nЯк? Запитаєте ви, а отак.\\n\",\"path\":\"київський-порядок.html\"},{\"title\":\"Цар землі | Документи КДБ\",\"content\":\"# Цар землі\\n\\nЯкий же я великий! <br>\\nУбивши всіх <br>\\nГордито лестив сам собі <br>\\nВеликий цар землі <br>\\n<br>\\nА як помер <br>\\nЛиш пляма гною й трохи пороху <br>\\nЗалишились від нього <br>\\nНа землі <br>\\n\",\"path\":\"цар-землі.html\"},{\"title\":\"Походження слова \\\"істина\\\" | Документи КДБ\",\"content\":\"# Походження слова \\\"істина\\\"\\n\\nВідомо, що від руського \\\"есть\\\" чи \\\"исть\\\". Але його, ймовірно, взяли хтось з наших з латинського \\\"est\\\" або з грецького відповідника, які означають те саме, що і сучасні англійське \\\"is\\\" чи німецьке \\\"ist\\\" чи французьке \\\"est\\\" чи іспанське \\\"es\\\" чи італійське \\\"è\\\" (а також інші).\\n\",\"path\":\"походження-слова-істина.html\"},{\"title\":\"Походження слова \\\"ітак\\\" | Документи КДБ\",\"content\":\"# Походження слова \\\"ітак\\\" (рос. \\\"итак\\\")\\n\\nВід латинського \\\"itaque\\\"...?\\n\",\"path\":\"походження-слова-ітак.html\"},{\"title\":\"Теорія Мови | Документи КДБ\",\"content\":\"# Теорія Мови\\n\\n> Начерк\\n\\n_**Діяч Здійснює.**_\\n\\nПриклад - \\\"Я люблю тебе.\\\":\\n\\n- \\\"Я\\\" - Здійснювач\\n- \\\"люблю тебе\\\" - Здійснюване\\n- \\\"люблю\\\" - Дія\\n- \\\"тебе\\\" - Задіяне\\n\\n## Примітки\\n\\nЦікаво, що Іван Нечуй-Левицький використовував \\\"діяльник\\\" або \\\"діючий предмет\\\" для позначення здійснювача.\\n\",\"path\":\"теорія-мови.html\"},{\"title\":\"Форма Дійсності | Документи КДБ\",\"content\":\"# Форма Дійсності\\n\\nВ Дійсності Діячі Здійснюють Дії Задіюючи Дійсних чи Недійсне.\\n\",\"path\":\"форма-дійсності.html\"},{\"title\":\"Як зрозуміти \\\"гравітацію\\\" | Документи КДБ\",\"content\":\"# Як зрозуміти \\\"гравітацію\\\"\\n\\nЯблуко, що лежить на столику ліворуч є важчим від того, що лежить на тому ж столику праворуч.\\nНа останньому кроці столик має ніжку лише посередині, яка нерухомо прикріплена до підлоги.\\n\\n<img style=\\\"border: 1px solid rgb(var(--border-rgb));\\\" width=\\\"100%\\\" src=\\\"../ресурси/гравітація_1_1.svg?v=1\\\" alt=\\\"\\\">\\n\\n<img style=\\\"border: 1px solid rgb(var(--border-rgb));\\\" width=\\\"100%\\\" src=\\\"../ресурси/гравітація_1_2.svg?v=1\\\" alt=\\\"\\\">\\n\\n<img style=\\\"border: 1px solid rgb(var(--border-rgb));\\\" width=\\\"100%\\\" src=\\\"../ресурси/гравітація_1_3.svg?v=1\\\" alt=\\\"\\\">\\n\\nЩо станеться на останньому кроці? І чому?\\n\\n<details>\\n  <summary>Що далі?</summary>\\n  Далі можна подумати: що буде, якщо зробити схоже, де замість столика буде натягнута гнучка тканина на якійсь висоті над підлогою.\\n\\n  Після чого можна пробувати розібратись в теоріях відносності.\\n</details>\",\"path\":\"як-зрозуміти-гравітацію.html\"},{\"title\":\"Хто кого | Документи КДБ\",\"content\":\"# Хто кого\\n\\nДій Дій.\\n\\nДії Дії.\\n\\nДія Дія.\\n\",\"path\":\"хто-кого.html\"},{\"title\":\"Чому ніщо це все? | Документи КДБ\",\"content\":\"# Чому ніщо це все?\\n\\n1. З чого все складається?\\n2. Якщо між двома предметами на картинці нижче нічого нема, то як виглядатиме картинка насправді?\\n   <img width=\\\"100%\\\" src=\\\"../ресурси/ніщоівсе.svg\\\" alt=\\\"\\\">\\n\",\"path\":\"чому-ніщо-це-все.html\"},{\"title\":\"Основа | Документи КДБ\",\"content\":\"# Основа\\n\\nЛюдина без людини не людина.\\n\\nЛюдина без залежностей ближче до Бога.\\n\\nЛюдина без любові мертва.\",\"path\":\"основа.html\"}]");

  window.addEventListener("message", (event) => {
    const eventData = event.data;
    const eventId = eventData.id;
    const eventType = eventData.type;
    if (eventType === "search") {
      const query = eventData.query;
      const results = searchData.filter((item) => {
        return item.title.toLowerCase().includes(query.toLowerCase());
      });
      window.parent.postMessage(
        {
          id: eventId,
          result: results
        },
        "*"
      );
    }
  });
</script>
